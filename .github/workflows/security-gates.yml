name: security-gates

# Independent gates, separate from plugin.yml:
#   - working-tree secret scan (gitleaks 8.30.1, pinned + checksum verified)
#   - git-history secret scan (all fetched branches; history-only findings)
#   - npm package content gate (tests/docs/secrets/static assets)
#
# The allowlist policy lives in .gitleaks.toml (finding-level line rules only,
# never path skips) and .gitleaksignore (reviewed commit fingerprints).

on:
  pull_request:
    paths:
      - "plugin/**"
      - "package.json"
      - ".gitleaks.toml"
      - ".gitleaksignore"
      - ".github/workflows/security-gates.yml"
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "package.json"
      - ".gitleaks.toml"
      - ".gitleaksignore"
      - ".github/workflows/security-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secrets-worktree:
    name: secrets (working tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Prove the allowlist is not vacuous
        working-directory: plugin
        run: bun run scripts/gitleaks-selftest.ts

  secrets-history:
    name: secrets (git history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every branch for the history scan
        run: git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan all reachable commits
        # History findings are reported without secret content (--redact);
        # reviewed public test vectors are fingerprinted in .gitleaksignore.
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

  package-contents:
    name: package contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Check both tarballs (root and plugin/)
        working-directory: plugin
        run: bun run scripts/pack-check.ts
